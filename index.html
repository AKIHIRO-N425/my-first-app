<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私の最初のアプリ</title>
</head>
<body>

  <h1>名前登録フォーム</h1>

  <input type="text" id="name" placeholder="名前を入力してください">
  <button onclick="registerName()">登録</button>

  <p id="message"></p>

  <h2>登録された名前</h2>
  <ul id="nameList"></ul>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl = "https://ufwepclstnyppbnbdhwh.supabase.co";

    const supabaseKey = "sb_publishable_zWZ4OEhF5tkYO36wW1rg9w_xQ6czR9r";

    const db = supabase.createClient(supabaseUrl, supabaseKey);

    async function registerName() {
      const name = document.getElementById("name").value;

      if (name === "") {
        document.getElementById("message").textContent =
          "名前を入力してください";
        return;
      }

      const { error } = await db
        .from("names")
        .insert([{ name: name }]);

      if (error) {
        document.getElementById("message").textContent =
          "登録に失敗しました：" + error.message;
        return;
      }

      document.getElementById("message").textContent =
        name + "さん、登録しました！";

      document.getElementById("name").value = "";

      showNames();
    }

    async function showNames() {
      const { data, error } = await db
        .from("names")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("message").textContent =
          "データの取得に失敗しました：" + error.message;
        return;
      }

      const nameList = document.getElementById("nameList");

      nameList.innerHTML = "";

      data.forEach(function(item) {
        const li = document.createElement("li");
        li.textContent = item.name;
        nameList.appendChild(li);
      });
    }

    showNames();
  </script>

</body>
</html>
